[package]
name = "openpaw-host"
description = "Local-first daemon that normalizes coding-agent activity and serves it to the OpenPaw app over loopback."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
name = "openpaw_host"
path = "src/lib.rs"

[[bin]]
name = "openpaw-host"
path = "src/main.rs"

[dependencies]
openpaw-protocol = { workspace = true }
openpaw-agents = { workspace = true }
openpaw-git = { workspace = true }
openpaw-files = { workspace = true }
openpaw-preview = { workspace = true }
openpaw-providers = { workspace = true }

anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rand = { workspace = true }
qrcode = { version = "0.14.1", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Not present in the workspace dependency table; pinned explicitly here so the
# sibling slices' manifests stay untouched.
toml = "1.1"
uuid = { version = "1.24", features = ["v4"] }

[dev-dependencies]
futures = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
