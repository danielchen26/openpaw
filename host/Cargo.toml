[workspace]
resolver = "2"
members = [
    "crates/openpaw-protocol",
    "crates/openpaw-agents",
    "crates/openpaw-git",
    "crates/openpaw-files",
    "crates/openpaw-preview",
    "crates/openpaw-host",
    "crates/openpaw-providers",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/danielchen26/openpaw"
authors = ["OpenPaw contributors"]

[workspace.dependencies]
openpaw-protocol = { path = "crates/openpaw-protocol" }
openpaw-agents = { path = "crates/openpaw-agents" }
openpaw-git = { path = "crates/openpaw-git" }
openpaw-files = { path = "crates/openpaw-files" }
openpaw-preview = { path = "crates/openpaw-preview" }
openpaw-providers = { path = "crates/openpaw-providers" }

anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures = "0.3"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
mime_guess = "2"
percent-encoding = "2"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "process", "sync", "time", "signal"] }
tokio-tungstenite = "0.30"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

# dev
jsonschema = "0.49"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "rustls-native-certs"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
